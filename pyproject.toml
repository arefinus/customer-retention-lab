[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-retention-lab"
version = "0.1.0"
description = "Leakage-controlled churn-risk demonstration on synthetic B2B accounts: point-in-time features, cohort retention, calibration and capacity-limited ranking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Sultanul Arefin Sourav" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
customer-retention-lab = "customer_retention_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::FutureWarning",
  "ignore::UserWarning",
]
